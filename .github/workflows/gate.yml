name: gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-24.04  # ubuntu-latest is 26.04, which Playwright has no Chromium for yet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The same command the README documents: lint, Python and web tests,
      # asset verification, and the headless-Chromium boot probe.
      - run: npm run gate
